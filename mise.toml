[tools]
node = "22"
rust = "stable"
sops = "latest"
age = "latest"

[tasks.setup]
description = "Install all dependencies (rust, node, gondolin-driver)"
run = ["mise install", "bash ops/ensure-cc.sh", "bash ops/check-tools.sh", "cargo fetch", "npm install", "npm --prefix tools/gondolin-driver install"]

[tasks.build]
description = "Build the cargo workspace (including spike examples)"
run = "cargo build --workspace --examples"

[tasks.test]
description = "Run all Rust tests"
run = "cargo test --workspace"

[tasks.lint]
description = "cargo fmt + clippy (CI parity)"
run = ["cargo fmt --all -- --check", "cargo clippy --workspace --examples -- -D warnings"]

[tasks.pi]
description = "Run the pi coding agent from the project root"
dir = "{{config_root}}"
run = "npx --no-install pi"
raw = true

[tasks."spike:pi-rpc"]
description = "Phase 0 spike: drive pi in RPC mode from Rust (prompt + resume)"
run = "cargo run -p castellan --example spike_pi_rpc --"

[tasks."spike:iroh"]
description = "Phase 0 spike: iroh control-order + gossip between two nodes (control|daemon)"
run = "cargo run -p suzerain --example spike_iroh --"

[tasks."spike:gondolin"]
description = "Phase 0 spike: boot a Gondolin VM and stream a long-running process's stdio"
run = "node tools/gondolin-driver/src/index.mjs --spike"

[tasks."dev-network"]
description = "Run suzerain standalone mode locally (one binary, two co-located processes)"
run = "bash ops/dev-network.sh"
raw = true

[tasks."dev:suzy"]
description = "Run suzerain + suzy wired together (dev): suzy's operator id pre-approved and its workspace pre-connected before either GUI/event loop starts"
run = "bash ops/dev-suzy.sh"
raw = true

[tasks."ui:test"]
description = "Headless-Chrome UI test (secrets add-provider flow) against a running suzerain"
run = "node tools/ui-test/ui-test.mjs"

[tasks.package]
description = "Build release binaries and install them to ~/.local/bin (plus the gondolin driver to the shared fleet home)"
run = """
cargo build --release
install -d ~/.local/bin
install -m 755 target/release/suzerain target/release/suz target/release/suzerain-mcp ~/.local/bin/
install -d ~/.local/share/suzerain/driver
rsync -a --delete --exclude node_modules tools/gondolin-driver/ ~/.local/share/suzerain/driver/
npm ci --prefix ~/.local/share/suzerain/driver --omit=dev
"""

[tasks."install:services"]
description = "Install + start suzerain as a user service (systemd or launchd)"
run = "bash ops/install-services.sh"
