[package]
name = "suzerain-protocol"
description = "Shared wire types for the suzerain control plane and castellan daemons"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
time.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util"] }
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
opentelemetry.workspace = true
opentelemetry-otlp.workspace = true
opentelemetry_sdk = "0.32"
tracing-opentelemetry.workspace = true
libc = "0.2"
sha2 = "0.11.0"
ssh-key = { version = "0.6", default-features = false, features = ["alloc", "ed25519", "ecdsa", "rsa", "encryption"] }

[dev-dependencies]
tokio = { workspace = true, features = ["io-util", "macros", "rt-multi-thread"] }
toml.workspace = true
