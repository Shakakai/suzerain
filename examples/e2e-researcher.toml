# Used by ops/e2e.sh — pinned to a free OpenRouter model so CI doesn't
# depend on a paid provider's quota. Free-tier models on OpenRouter draw
# from a shared per-model rate-limit pool, so occasional 429s here are
# expected flakiness, not a regression — retry the job before digging in.
# Needs a large context window: pi's default request budget alone runs
# ~258k tokens, which ruled out liquid/lfm-2.5-2.6b:free (65536 ctx, 400
# "maximum context length exceeded"). Avoid time-limited "stealth" preview
# models too (stealth/ox-alpha's testing period ended 2026-08-26, breaking
# this file with a 404) and ones needing a paid slug despite the ":free"
# name (openai/gpt-oss-20b:free did exactly that the same day). Verify a
# candidate before swapping:
#   curl https://openrouter.ai/api/v1/chat/completions -H "Authorization: Bearer $OPENROUTER_API_KEY" \
#     -d '{"model": "<id>", "messages": [{"role":"user","content":"hi"}]}'
name = "researcher-1"
harness = { type = "pi", version = "0.84.1" }
model = { provider = "openrouter", id = "minimax/minimax-m3:free" }

[[repos]]
url = "https://github.com/octocat/Hello-World.git"
ref = "master"

[secrets]
providers = ["openrouter"]
