name: e2e

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: e2e
  cancel-in-progress: true

jobs:
  lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
      GONDOLIN_ACCEL: kvm
    steps:
      - uses: actions/checkout@v4

      - name: Verify KVM availability
        run: |
          if [ ! -e /dev/kvm ]; then
            echo "::error::/dev/kvm missing — nested virtualization unavailable"
            exit 1
          fi
          sudo chmod o+rw /dev/kvm
          ls -l /dev/kvm

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install qemu, sops, age
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 age nodejs npm
          SOPS_VERSION=v3.10.2
          SOPS_ASSET="sops-${SOPS_VERSION}.linux.amd64"
          curl -fsSL -o /tmp/sops "https://github.com/getsops/sops/releases/download/${SOPS_VERSION}/${SOPS_ASSET}"
          curl -fsSL -o /tmp/sops.checksums.txt "https://github.com/getsops/sops/releases/download/${SOPS_VERSION}/sops-${SOPS_VERSION}.checksums.txt"
          sha256() {
            if command -v sha256sum >/dev/null 2>&1; then sha256sum "$1" | awk '{print $1}';
            else shasum -a 256 "$1" | awk '{print $1}'; fi
          }
          want="$(awk -v f="$SOPS_ASSET" '$2 == f {print $1}' /tmp/sops.checksums.txt)"
          [ -n "$want" ] || { echo "::error::$SOPS_ASSET not listed in sops checksums file"; exit 1; }
          got="$(sha256 /tmp/sops)"
          [ "$want" = "$got" ] || { echo "::error::checksum mismatch for $SOPS_ASSET (want $want, got $got)"; exit 1; }
          sudo install -m 755 /tmp/sops /usr/local/bin/sops
          sops --version

      - name: Install gondolin-driver deps
        run: npm ci --prefix tools/gondolin-driver

      - name: Install ui-test deps
        run: npm ci --prefix tools/ui-test

      - name: Cache Gondolin guest assets (~600MB)
        uses: actions/cache@v4
        with:
          path: ~/.cache/gondolin/images
          key: gondolin-assets-${{ runner.os }}-${{ hashFiles('tools/gondolin-driver/package-lock.json') }}
          restore-keys: gondolin-assets-${{ runner.os }}-

      - name: Build workspace
        run: cargo build --workspace --all-targets

      - name: Run lifecycle e2e
        run: ./ops/e2e.sh
