name: e2e

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: e2e
  cancel-in-progress: true

jobs:
  lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
      GONDOLIN_ACCEL: kvm
    steps:
      - uses: actions/checkout@v4

      - name: Verify KVM availability
        run: |
          if [ ! -e /dev/kvm ]; then
            echo "::warning::/dev/kvm missing — nested virtualization unavailable on this runner"
          fi
          ls -l /dev/kvm || true

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install qemu, sops, age
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 sops age nodejs npm

      - name: Install gondolin-driver deps
        run: npm ci --prefix tools/gondolin-driver

      - name: Cache Gondolin guest assets (~600MB)
        uses: actions/cache@v4
        with:
          path: ~/.cache/gondolin/images
          key: gondolin-assets-${{ runner.os }}-${{ hashFiles('tools/gondolin-driver/package-lock.json') }}
          restore-keys: gondolin-assets-${{ runner.os }}-

      - name: Build workspace
        run: cargo build --workspace --all-targets

      - name: Run lifecycle e2e
        run: ./ops/e2e.sh
