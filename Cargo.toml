[workspace]
resolver = "2"
members = [
    "crates/protocol",
    "crates/castellan",
    "crates/suzerain",
    "crates/suzerain-cli",
    "crates/suzerain-mcp",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Shakakai/suzerain"

[workspace.dependencies]
# networking (iroh: QUIC p2p, pubkey identity)
iroh = "1"
iroh-gossip = "0"

# async
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
n0-future = "0.3"
n0-error = "1"

# ser/de
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# storage
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "postgres", "tls-rustls"] }

# cli / config
clap = { version = "4", features = ["derive", "env"] }
toml = "0.8"

# observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# misc
anyhow = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }
secrecy = { version = "0.10", features = ["serde"] }

# telemetry (OTEL export for the daemons themselves)
opentelemetry = "0.32"
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["trace", "http-proto", "reqwest-client", "reqwest-rustls", "tls-provider-agnostic"] }
tracing-opentelemetry = "0.33"

# outbound HTTP (pi.dev package catalog crawl)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "charset", "json"] }

[profile.release]
lto = "thin"
strip = true
